[project]
name = "pitlane"
version = "0.1.0"
description = "Benchmark harness for LangGraph workflows against swappable vLLM serving stacks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pitlane = "pitlane.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitlane*"]
