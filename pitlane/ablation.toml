# Ablation modes for the `ours` arm.
#
# Each mode becomes an arm named `ours_<mode>`, derived from `[ours]` in
# arms.toml with these switches applied over its env. They are arms and
# not a runtime flag for one reason: a cell is keyed by (arm, question, rep),
# so two modes under one arm name would write to the same directory and
# `summary.md` would have nothing to pivot. As separate arms they share a run
# id and land side by side:
#
#   ARMS="ours_full ours_predictor_only ours_no_prefetch" ./launch-batch.sh 50
#
# The switches, and what they reach:
#
#   node_eviction   VLLM_NODE_EVICTION_POLICY   vLLM server; the free-block
#                   queue is upstream LRU when off
#   prefetch        KV_EVICTION_DISABLE_PREFETCH (inverted)  langgraph's live
#                   predictor -- and the master switch: with it off the
#                   workflow clears LANGGRAPH_VLLM_AGENT_ENABLE and
#                   ..._BASE_URL, which turns the two below off with it
#   prompt_seeds    ODR_PROMPT_SEEDS            the compress and final-report
#                   prompt seeds
#   pseudo_dynamic  LANGGRAPH_PROMPT_PSEUDO_DYNAMIC   whether a manufactured
#                   segment (date, mcp_prompt, a bare {placeholder}) may be
#                   filled when building a prefix, or blocks it
#   population      --skip-system-prompt-population (a CLI flag, and a negative
#                   one, so "on" is the absence of an argument)  whether the
#                   prefix registry is seeded before the measured phase
#
# Omitting a switch leaves whatever the arm and the environment already say.
# `prompt_seeds` and `pseudo_dynamic` are only meaningful while `prefetch` is
# true; a mode that sets them with prefetch off is rejected at load, because
# the run would silently be the same as `no_prefetch` under a different name.
#
# The system prompt population phase is a switch only where it means something:
# `population = false` is rejected at load unless `prefetch = false` too. With
# prefetch on, the registry is written only by /v1/agent_chat and /v1/agents/*,
# so skipping the phase leaves every lookup empty and every prefetch a silent
# no-op -- an invalid run, not an ablation. With prefetch off there is no
# lookup to leave empty, and the phase is simply a prefill of every node's
# system prompt, which is warming ahead of a request by another name.
#
# The modes are a ladder, not a grid: each rung removes exactly one switch from
# the rung above it, which is what makes a difference between two of them
# attributable to that switch.
#
#   full             prefetch + prompt seeds + filled prefixes + eviction
#   no_seeds         full, minus the prompt seeds; prefixes still fill
#   predictor_only   prefetch + eviction; ODR adds nothing on top
#   no_prefetch      eviction alone; nothing is warmed ahead of a request,
#                    including the population phase's own prefill
#   none             the floor: both halves off, upstream LRU underneath
#
# Node eviction is on in every rung but the last. It is the floor the warming
# mechanisms are built on, and switching it off takes the controller with it --
# and the kv_hbm_ttft line, so there is nothing left to diff against. `none` is
# below the ladder rather than on it for that reason: it is the build with
# everything off, and its only job is the gap to `baseline`.
#
# So `full - no_seeds` and `no_seeds - predictor_only` are the two things
# open_deep_research contributes, `predictor_only - no_prefetch` is what
# langgraph's predictor contributes, `no_prefetch - none` is what the eviction
# policy contributes, and `none - baseline` is what the build costs before any
# of it -- which should be nothing, and is worth confirming once rather than
# every batch. Every mode is a full re-run of the whole matrix, so five modes
# is five eleven-hour batches; that is the reason this is a ladder and not the
# seven-mode grid it replaced.
#
# `no_seeds` splits the middle step in two. `full - no_seeds` is what the prompt
# seeds are worth on their own, and `no_seeds - predictor_only` is what filling
# a prefix past its first manufactured segment is worth -- the two halves of
# what `full - predictor_only` gives as one number. It is the rung to drop
# first if the schedule will not take four.

[full]
description = "everything on: eviction, predictor, prompt seeds, filled prefixes"
node_eviction = true
prefetch = true
prompt_seeds = true
pseudo_dynamic = true

[no_seeds]
description = "full, minus the compress and final-report prompt seeds"
node_eviction = true
prefetch = true
prompt_seeds = false
pseudo_dynamic = true

[predictor_only]
description = "prefetch and eviction: the live predictor with nothing on top"
node_eviction = true
prefetch = true
prompt_seeds = false
pseudo_dynamic = false

[no_prefetch]
description = "eviction alone: nothing is warmed ahead of a request"
node_eviction = true
prefetch = false
# The system prompt population phase, off here and nowhere else. It is not an
# ablation switch anywhere prefetch is on: only /v1/agent_chat and /v1/agents/*
# write the prefix registry, so an unseeded registry makes every lookup empty
# and every warm a silent no-op -- prefetch on paper, absent in fact. A mode
# that tries it with prefetch on is rejected at load.
#
# With prefetch off there is no lookup to leave empty, and leaving it on would
# make this rung "eviction, plus every node's system prompt already resident in
# HBM" -- the phase prefills what it seeds. That is warming ahead of a request,
# which is the thing this rung is defined by not doing.
population = false

[none]
description = "the floor on this build: both halves off, upstream LRU underneath"
node_eviction = false
prefetch = false
# Skipped for the same reason as in `no_prefetch`, and more so: this arm exists
# to be the floor, and a phase that prefills every node's system prompt into
# HBM is not the floor.
population = false
